name: Feeds job

# Reads the startup news feeds (deutsche-startups.de #Brandneu, startupticker.ch, EU-Startups) and
# screens their new articles onto the radar (docs/adr/0009). Daily at 06:00 UTC: 07:00 in Germany in
# winter, 08:00 in summer. It can also be run by hand, from main only.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feeds-job
  cancel-in-progress: false

jobs:
  screen:
    # Never against production data from an unmerged branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      # Pinned to commits, because this job holds secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The log of a public repo shows counts only; details are stored with the run in the database.
      - run: npm run job:feeds
